name: Wheels

# Platform wheels that carry the patched BLAST engine, the sdist, the install proof on clean runners, and (on a tag
# v*) publishing. Publishing is off until the repository variables PUBLISH_TESTPYPI and PUBLISH_PYPI are set to
# "true" and trusted publishing is configured on TestPyPI and PyPI. PyPI comes only after TestPyPI succeeded.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - pyproject.toml
      - MANIFEST.in
      - licenses/**
      - src/textblast/engine/**
      - .github/scripts/**
      - .github/workflows/wheels.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  # The oldest macOS the bundled binaries run on (macOS 11 is the first on Apple silicon).
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  # OpenMP in the Linux engine: auto = on (libgomp is then copied into the wheel by auditwheel).
  WHEEL_OPENMP: auto
  MANYLINUX: manylinux_2_28_x86_64

jobs:
  wheel-macos:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install textblast
        run: python -m pip install .
      - name: Engine fingerprint
        id: key
        run: python .github/scripts/engine_key.py "$WHEEL_OPENMP"
      # The deployment target is not part of the fingerprint, so this cache is separate from the CI engine's.
      - name: Restore the engine
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.key.outputs.engine_dir }}
          key: wheel-macos-15-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ steps.key.outputs.key }}
      - name: Build the engine
        if: steps.cache.outputs.cache-hit != 'true'
        run: textblast engine build --openmp "$WHEEL_OPENMP"
      - name: Save the engine
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.key.outputs.engine_dir }}
          key: wheel-macos-15-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ steps.key.outputs.key }}
      - name: Build the wheel
        run: |
          tag="macosx_${MACOSX_DEPLOYMENT_TARGET/./_}_arm64"
          python .github/scripts/build_wheel.py --plat-name "$tag" --openmp "$WHEEL_OPENMP" --out wheelhouse
          for binary in "${{ steps.key.outputs.engine_dir }}"/bin/*; do otool -L "$binary"; done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos
          path: wheelhouse/*.whl
          if-no-files-found: error

  wheel-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install textblast
        run: python -m pip install .
      - name: Engine fingerprint
        id: key
        env:
          TEXTBLAST_CACHE: ${{ runner.temp }}/engine-cache
        run: python .github/scripts/engine_key.py "$WHEEL_OPENMP"
      - name: Restore the engine
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.key.outputs.engine_dir }}
            ${{ steps.key.outputs.tarball }}
          key: wheel-${{ env.MANYLINUX }}-${{ steps.key.outputs.key }}
      - name: Build the engine and the wheel in the manylinux container
        run: |
          mkdir -p "${{ runner.temp }}/engine-cache"
          docker run --rm -v "$PWD:/io" -v "${{ runner.temp }}/engine-cache:/cache" -e TEXTBLAST_CACHE=/cache \
            -e PLAT="$MANYLINUX" -e WHEEL_OPENMP -e PYTHONUNBUFFERED \
            "quay.io/pypa/$MANYLINUX" bash /io/.github/scripts/build_linux_wheel.sh
      - name: Save the engine
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.key.outputs.engine_dir }}
            ${{ steps.key.outputs.tarball }}
          key: wheel-${{ env.MANYLINUX }}-${{ steps.key.outputs.key }}
      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux
          path: ${{ runner.temp }}/engine-cache/build/*/build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build --sdist --outdir dist
      - name: No binaries in the sdist
        run: |
          if tar tzf dist/*.tar.gz | grep -q "_engine/"; then echo "the sdist contains an engine"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Each wheel in a fresh virtualenv on a clean runner, without the repository: `engine check` and a tiny run.
  proof:
    needs: [wheel-macos, wheel-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, wheel: wheel-macos, python: "3.10" }
          - { os: macos-15, wheel: wheel-macos, python: "3.14" }
          - { os: ubuntu-22.04, wheel: wheel-linux, python: "3.10" }
          - { os: ubuntu-24.04, wheel: wheel-linux, python: "3.14" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts/smoke_test.py
          sparse-checkout-cone-mode: false
          path: repo
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.wheel }}
          path: wheel
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the wheel into a fresh virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install wheel/*.whl
          cp repo/.github/scripts/smoke_test.py "$RUNNER_TEMP/"
          rm -rf repo
      - name: Engine check and a tiny run
        working-directory: ${{ runner.temp }}
        env:
          TEXTBLAST_CACHE: ${{ runner.temp }}/empty-cache
        run: venv/bin/python -I smoke_test.py --expect-source bundled smoke

  # The sdist installs without an engine and says how to get one.
  proof-sdist:
    needs: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: sdist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the sdist and ask for the engine
        env:
          TEXTBLAST_CACHE: ${{ runner.temp }}/empty-cache
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install sdist/*.tar.gz
          if "$RUNNER_TEMP/venv/bin/textblast" engine info 2> err.txt; then echo "found an engine"; exit 1; fi
          cat err.txt
          grep -q "run \`textblast engine build\` once" err.txt

  publish-testpypi:
    needs: [proof, proof-sdist]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TESTPYPI == 'true'
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    needs: [proof, proof-sdist, publish-testpypi]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
