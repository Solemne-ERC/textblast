[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "textblast"
version = "0.1.0"
description = "Text reuse detection with a patched NCBI BLAST engine and a data-agnostic Python pipeline."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
authors = [{ name = "Gleb Schmidt" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "polars>=1.0",
    "jsonargparse>=4.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
textblast = "textblast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The engine bundled in platform wheels (put there by the wheel build; absent from the repository and the sdist).
[tool.setuptools.package-data]
textblast = ["_engine/engine.json", "_engine/bin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "engine: needs built BLAST engines (skipped when none is found)",
    "corpus: needs data/corpus.jsonl (skipped when absent)",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
